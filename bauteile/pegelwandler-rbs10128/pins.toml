# Pinbelegung Pegelwandler RBS10128 (JY-MCU, 4 Kanaele, eigener 3,3-V-Regler), Footprint Bauteile:Pegelwandler_Sockel.
# Stand 06.11.2026. Aufdruck am gelieferten Teil gelesen am 04.11.2026 (eigene Fotos); Lage und Paarung der Kanaele am
# Steckbrett gemessen am 06.11.2026.
# Stifte: gerade Leisten, im Lieferzustand unter dem Modul nach aussen gebogen, am 04.11.2026 senkrecht zurueckgebogen.
# Aufdruck nur auf der Textseite (die Seite ohne Bauteile; sie liegt beim Stecken OBEN, Bauteile und Kunststoff der Leisten
# zeigen zur Platine) und nur am Ende mit der Versorgung: L-Seite "3V" dann "GND", H-Seite "5V" dann "GND". Mit lesbarem
# Aufdruck liegt 5V oben links und 3V oben rechts (Scan 04.11.2026, Steckbrett-Foto 06.11.2026, berichtigt 08.11.2026).
# Die vier unbeschrifteten Stifte je Seite sind die Kanaele. Gemessen 06.11.2026 (nur 12 V am Steckbrett): ein
# L-Stift auf Masse zieht genau den gerade gegenueberliegenden H-Stift auf etwa 1 mV, die anderen bleiben bei 4,76 V.
# Also L1 zu H1 bis L4 zu H4, gezaehlt vom Versorgungsende.
# Reihenabstand 12,66 mm gemessen (13,33 aussen minus 0,67 Stiftdicke, 04.11.2026), im Footprint 12,7 (5 x 2,54).
# 3V ist der Ausgang des eigenen Reglers (Aufdruck "I<150mA" mit Pfeil 5V nach 3V; gemessen 06.11.2026: 3,342 V bei
# 5 V am 5V-Stift). Er bleibt auf der Uhr-Platine unverbunden (halt = true), damit nicht zwei Regler (XIAO und Modul)
# gegeneinander arbeiten.
# Stromlos gemessen 06.11.2026 (DT132A): H1 gegen 5V 67,5 kOhm, L1 gegen 3V kein fester Wert; also keine 10-kOhm-Pull-ups
# wie beim alten RBS16466. Die Pull-ups fuer die Anzeige kommen von R1 und R2 (2,2 kOhm) auf der Uhr-Platine.
# Ruhepegel unter Strom (06.11.2026): L1 3,363 V, H1 4,76 V.
