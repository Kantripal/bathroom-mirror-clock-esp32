# Probeentwurf 4 der Uhr-Platine, gestapelt hinter der Anzeige, Stand 06.11.2026. Ansicht von der Modulseite.
# Gegenueber Probe 3 (03.11.2026, dort neu D1, D2, TP1, R3, R4, C2, Kabelbinder-Loecher): Footprint des Pegelwandlers
# berichtigt (3V und 5V am unteren Ende, am Steckbrett gemessen 06.11.2026), Netze von U2 und U4 auf die Pintabellen vom
# 04.11.2026 (Uhrmodul nur 4er-Reihe SCL SDA VCC GND; Pegelwandler 3V GND L1..L4 und 5V GND H1..H4 vom Versorgungsende),
# alle Annahmen gestrichen, weil Lochbilder und Belegungen am 04. und 06.11.2026 gemessen sind (Steckbriefe in Bauteile/).
# Anordnung: Mit den gemessenen Footprints (Anzeige 57,4 statt 60,54 mm Reihenabstand, Pegelwandler 12,7 statt 11,3,
# Wandler mit Lasche) stiessen in Probe 3 die Stiftreihe der Anzeige und die L-Reihe des Pegelwandlers zusammen und die
# Hoefe von Pegelwandler und XIAO ueberlappten. Darum: Anzeige bleibt bei x 35; Pegelwandler, XIAO und Wandler ruecken
# mit je 0,3 mm Hofabstand auf (16,5 / 34 / 52,1); alles rechts davon wandert 5,5 mm nach rechts, die Platine wird
# 134,1 statt 128,6 mm lang; C1, D1, R4 weichen der rechten Stiftreihe der Anzeige aus (C1 oben, D1 rechts davon).
# Der Steckbrett-Test mit genau diesen Modulen lief am 06.11.2026.
[platine]
name = "badspiegel-platine"
titel = "Badspiegel-Uhr"
breite = 134.1
hoehe = 27
regeln = "aisler-enig"
# Fassung v1.0 = gebaute und getestete Platine (bestellt am 07.11.2026 als "Probe 4", seit 24.11.2026 im Aufdruck v1.0;
# Kupfer, Bohrungen und Umriss sind unveraendert). Folgefassungen heissen v1.1, v2.0 usw., nicht "Probe 5".
revision = "v1.0"
datum = "2026-11-06"
masseflaeche = true

# Hinten unter dem Uhrmodul, rechts neben seiner 4er-Reihe (x 80 bis 113): Text gespiegelt, darunter das Schreibfeld.
[aufdruck]
x = 96.0
y = 10
feld = true

# Aisler-Logo-Platzhalter fuer den Sponsoring-Rabatt, 32 x 8 mm auf der Rueckseite unter dem Schreibfeld (x 80 bis 112,
# y 17,85 bis 25,85). Die bestellte Platine (07.11.2026) traegt ihn noch von Hand per pcbnew gesetzt, an genau dieser Stelle;
# `pruefen` erkennt ihn dort und meldet keine Abweichung. Ein neues `bauen` setzt ihn aus diesem Eintrag selbst.
[aisler_logo]
x = 96.0
y = 21.85
laenge = 32
richtung = "waagerecht"
seite = "hinten"

