<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badspiegel-Uhr Gehäuse</title>
<style>
  :root { --bg: #f7f6f2; --text: #2c2c2a; --muted: #5f5e5a; --line: #d3d1c7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1d; --text: #e8e6de; --muted: #b4b2a9; --line: #444441; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  p { margin: 4px 0 12px; color: var(--muted); }
  #ansicht { width: 100%; height: 62vh; min-height: 320px; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  .leiste { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 10px 0; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; }
  .farbe { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  figure { margin: 24px 0; }
  figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #f7f6f2; }
  figcaption { color: var(--muted); }
</style>
</head>
<body>
<h1>Badspiegel-Uhr, Gehäuse für Platine Probe 4</h1>
<p>Stand __DATUM__, Länge __LAENGE__ mm. Ziehen dreht, Mausrad zoomt. Von hinten gesehen liegen die Kabel rechts, von vorn links.</p>
<div id="ansicht"></div>
<div class="leiste">
  <button data-blick="hinten">Von hinten</button>
  <button data-blick="vorn">Von vorn</button>
  <button data-blick="oben">Von oben</button>
  <label><input type="checkbox" id="mit_gehaeuse" checked> Gehäuse</label>
  <label><input type="checkbox" id="mit_deckel" checked> Deckel</label>
  <label><input type="checkbox" id="mit_teilen" checked> Bestückung</label>
</div>
<div class="leiste" id="legende"></div>
__BILDER__
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const BOXEN = __BOXEN__, ANTENNE = __ANTENNE__, LAENGE = __LAENGE__;
const FARBEN = { anz: ["#d4a017", "Anzeige"], uhr: ["#4169e1", "Uhrmodul"], klotz: ["#d33", "Klotz"],
  kabel1: ["#222", "Kabel"], kabel2: ["#222", ""], xiao: ["#7b2d8b", "XIAO"], wandler: ["#0f8a8a", "Wandler"],
  pegel: ["#e08a00", "Pegelwandler"], pl: ["#1d6b2a", "Platine"], antenne: ["#f2f2f2", "Antenne"] };
const leg = document.getElementById("legende");
for (const [k, [f, n]] of Object.entries(FARBEN)) if (n) leg.insertAdjacentHTML("beforeend",
  `<span><span class="farbe" style="background:${f}"></span>${n}</span>`);
leg.insertAdjacentHTML("beforeend", '<span><span class="farbe" style="background:#999"></span>übrige Bauteile</span>');

function stl(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), dv = new DataView(bin.buffer);
  const n = dv.getUint32(80, true), pos = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) for (let j = 0; j < 9; j++) pos[i * 9 + j] = dv.getFloat32(84 + i * 50 + 12 + j * 4, true);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
function quader(b, farbe) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(b[1] - b[0], b[3] - b[2], b[5] - b[4]),
    new THREE.MeshLambertMaterial({ color: farbe }));
  m.position.set((b[0] + b[1]) / 2, (b[2] + b[3]) / 2, (b[4] + b[5]) / 2);
  return m;
}
const feld = document.getElementById("ansicht");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
feld.appendChild(renderer.domElement);
const szene = new THREE.Scene();
szene.add(new THREE.AmbientLight(0xffffff, 0.55));
const licht = new THREE.DirectionalLight(0xffffff, 0.7); licht.position.set(0.4, 1, 0.8); szene.add(licht);
const kamera = new THREE.PerspectiveCamera(35, 1, 1, 2000);
const welt = new THREE.Group(), modell = new THREE.Group();
// Modell: y zeigt nach unten, z vom Glas zur Wand. Um x gedreht steht oben oben und vorn vorn.
modell.rotation.x = Math.PI;
modell.position.set(-LAENGE / 2, 0, 14);
welt.add(modell); szene.add(welt);
const gehaeuse = new THREE.Mesh(stl("__GEHAEUSE__"), new THREE.MeshLambertMaterial({ color: 0xb8b6ad, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false }));
const deckel = new THREE.Mesh(stl("__DECKEL__"), new THREE.MeshLambertMaterial({ color: 0x5f5e5a, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
const teile = new THREE.Group();
for (const [name, gruppe, b] of BOXEN) teile.add(quader(b, (FARBEN[gruppe] || ["#999"])[0]));
teile.add(quader(ANTENNE, FARBEN.antenne[0]));
modell.add(teile, gehaeuse, deckel);
for (const [id, obj] of [["mit_gehaeuse", gehaeuse], ["mit_deckel", deckel], ["mit_teilen", teile]])
  document.getElementById(id).addEventListener("change", e => { obj.visible = e.target.checked; zeichne(); });

let gier = Math.PI - 0.5, nick = 0.45, abstand = 200;
const BLICKE = { hinten: [Math.PI - 0.5, 0.45], vorn: [0.5, 0.35], oben: [0, 1.45] };
document.querySelectorAll("[data-blick]").forEach(k => k.addEventListener("click", () => {
  [gier, nick] = BLICKE[k.dataset.blick]; zeichne(); }));
function zeichne() {
  kamera.position.set(abstand * Math.sin(gier) * Math.cos(nick), abstand * Math.sin(nick), abstand * Math.cos(gier) * Math.cos(nick));
  kamera.lookAt(0, 0, 0);
  renderer.render(szene, kamera);
}
function groesse() {
  const w = feld.clientWidth, h = feld.clientHeight;
  renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio || 1);
  kamera.aspect = w / h; kamera.updateProjectionMatrix(); zeichne();
}
let zug = null;
feld.addEventListener("pointerdown", e => { zug = [e.clientX, e.clientY]; feld.setPointerCapture(e.pointerId); });
feld.addEventListener("pointermove", e => {
  if (!zug) return;
  gier -= (e.clientX - zug[0]) * 0.008;
  nick = Math.max(-1.5, Math.min(1.5, nick + (e.clientY - zug[1]) * 0.008));
  zug = [e.clientX, e.clientY]; zeichne();
});
feld.addEventListener("pointerup", () => zug = null);
feld.addEventListener("wheel", e => { e.preventDefault(); abstand = Math.max(60, Math.min(800, abstand * (e.deltaY > 0 ? 1.1 : 0.9))); zeichne(); }, { passive: false });
window.addEventListener("resize", groesse);
groesse();
</script>
</body>
</html>
